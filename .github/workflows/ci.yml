name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Pytest, BDD, and Forensic Audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Pytest suite
        run: uv run pytest tests/

      - name: Run BDD acceptance features (Behave)
        run: uv run behave features/

      - name: Run Paper 01 Data Care & Forensic Audit
        run: uv run python studies/cambrian-substrate/tests/data_care_audit.py

      - name: Run Cambrian Taphonomic Calibration Pipeline
        run: uv run python studies/cambrian-substrate/pipelines/stage_calibrate_taphonomic_diversity.py
